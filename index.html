<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗＆エリア管理マップ</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
    #toolbar { padding: 8px 12px; background: #333; color: #fff; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #toolbar select, #toolbar button { padding: 6px 12px; font-size: 14px; cursor: pointer; border-radius: 4px; border: none; }
    #toolbar select { background: #fff; color: #333; }
    #toolbar button { background: #007bff; color: white; }
    #toolbar button.danger { background: #dc3545; }
    #toolbar button.secondary { background: #6c757d; }
    #map { flex: 1; width: 100%; height: 100%; }

    /* モーダルスタイル */
    .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
    .modal-content h3 { margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .modal-buttons button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }

    /* 管理用リストアイテム表示 */
    .manage-list { list-style: none; margin-bottom: 12px; }
    .manage-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; gap: 8px; }
    .manage-item input[type="text"] { flex: 1; padding: 4px 8px; }
    .manage-item .actions { display: flex; gap: 4px; }
    .manage-item button { padding: 4px 8px; font-size: 12px; }

    /* Accordion Style for Lists */
    .accordion-item { border: 1px solid #ddd; margin-bottom: 8px; border-radius: 4px; overflow: hidden; }
    .accordion-header { background: #f7f7f7; padding: 10px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .accordion-content { display: none; padding: 10px; border-top: 1px solid #ddd; }
    .accordion-item.open .accordion-content { display: block; }
  </style>
</head>
<body>

  <div id="toolbar">
    <label for="mapSelect">マップ:</label>
    <select id="mapSelect" onchange="switchMap(this.value)"></select>
    <button onclick="openMapManageModal()">マップ管理</button>
    <button onclick="openNewMapModal()">新規マップ作成</button>
    <button onclick="openAreaManageModal()">エリア登録・管理</button>
    <button onclick="openListManageModal()">リスト管理</button>
    <button onclick="openStoreModal()">新規店舗追加</button>
  </div>

  <div id="map"></div>

  <!-- マップ管理モーダル 【1】 -->
  <div id="mapManageModal" class="modal">
    <div class="modal-content">
      <h3>既存マップの編集・並び替え</h3>
      <ul id="mapManageList" class="manage-list"></ul>
      <div class="modal-buttons">
        <button class="secondary" onclick="closeModal('mapManageModal')">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 新規マップ作成モーダル 【2】 -->
  <div id="newMapModal" class="modal">
    <div class="modal-content">
      <h3>新規マップ作成</h3>
      <div class="form-group">
        <label for="newMapName">マップ名</label>
        <input type="text" id="newMapName" placeholder="マップ名を入力">
      </div>
      <div class="modal-buttons">
        <button class="secondary" onclick="closeModal('newMapModal')">キャンセル</button>
        <button onclick="createMap()">作成</button>
      </div>
    </div>
  </div>

  <!-- エリア登録・管理モーダル <4> -->
  <div id="areaManageModal" class="modal">
    <div class="modal-content">
      <h3>エリア新規追加</h3>
      <div class="form-group">
        <label for="newAreaName">エリア名</label>
        <input type="text" id="newAreaName" placeholder="新規エリア名">
      </div>
      <div class="form-group">
        <label for="newAreaLat">中心緯度</label>
        <input type="number" step="any" id="newAreaLat">
      </div>
      <div class="form-group">
        <label for="newAreaLng">中心経度</label>
        <input type="number" step="any" id="newAreaLng">
      </div>
      <div class="form-group">
        <label for="newAreaRadius">半径 (m)</label>
        <input type="number" id="newAreaRadius" value="500">
      </div>
      <button onclick="addArea()" style="width: 100%; padding: 8px; margin-bottom: 16px;">新規エリア追加</button>

      <h3>登録済みエリアの編集・並び替え</h3>
      <ul id="areaManageList" class="manage-list"></ul>

      <div class="modal-buttons">
        <button class="secondary" onclick="closeModal('areaManageModal')">閉じる</button>
      </div>
    </div>
  </div>

  <!-- リスト管理モーダル <5> -->
  <div id="listManageModal" class="modal">
    <div class="modal-content">
      <h3>リスト管理</h3>
      <div id="accordionContainer"></div>
      <div class="modal-buttons">
        <button class="secondary" onclick="closeModal('listManageModal')">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 店舗登録/編集モーダル -->
  <div id="storeModal" class="modal">
    <div class="modal-content">
      <h3 id="storeModalTitle">店舗追加</h3>
      <input type="hidden" id="storeId">
      <div class="form-group">
        <label for="storeName">店舗名</label>
        <input type="text" id="storeName">
      </div>
      <div class="form-group">
        <label for="storeLat">緯度</label>
        <input type="number" step="any" id="storeLat">
      </div>
      <div class="form-group">
        <label for="storeLng">経度</label>
        <input type="number" step="any" id="storeLng">
      </div>
      <div class="form-group">
        <label for="storeMemo">メモ</label>
        <textarea id="storeMemo" rows="3"></textarea>
      </div>
      <div class="modal-buttons">
        <button class="secondary" onclick="closeModal('storeModal')">キャンセル</button>
        <button onclick="saveStore()">保存</button>
      </div>
    </div>
  </div>

  <!-- 共有モーダル 【3】 -->
  <div id="shareModal" class="modal">
    <div class="modal-content">
      <h3>他マップへの共有</h3>
      <p style="margin-bottom: 8px;">共有先のマップを選択してください（複数可）:</p>
      <div id="shareMapCheckboxes" style="margin-bottom: 16px;"></div>
      <div class="modal-buttons">
        <button class="secondary" onclick="closeModal('shareModal')">キャンセル</button>
        <button onclick="executeShare()">共有実行</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 定数制限設定 <1>
    const MAX_STORES = 200;
    const MAX_AREAS = 100;
    const MAX_MAPS = 30;
    const MAX_LISTS = 50;

    // アプリ状態データ
    let appData = {
      currentMapId: "default",
      maps: [
        { id: "default", name: "メインマップ" }
      ],
      stores: {}, // mapId -> []
      areas: {}   // mapId -> []
    };

    let leafletMap;
    let storeMarkers = {};
    let areaCircles = {};
    let currentShareStoreId = null;

    // 初期化
    window.onload = function() {
      loadLocalStorage();
      initMap();
      renderMapSelect();
      loadCurrentMapData();
    };

    function loadLocalStorage() {
      const dataStr = localStorage.getItem("map_app_data");
      if (dataStr) {
        try {
          appData = JSON.parse(dataStr);
        } catch(e) {
          console.error(e);
        }
      }
      if (!appData.maps || appData.maps.length === 0) {
        appData.maps = [{ id: "default", name: "メインマップ" }];
      }
      if (!appData.currentMapId) appData.currentMapId = appData.maps[0].id;
      if (!appData.stores) appData.stores = {};
      if (!appData.areas) appData.areas = {};
    }

    function saveLocalStorage() {
      localStorage.setItem("map_app_data", JSON.stringify(appData));
    }

    function initMap() {
      leafletMap = L.map('map').setView([35.681236, 139.767125], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(leafletMap);
    }

    function renderMapSelect() {
      const select = document.getElementById("mapSelect");
      select.innerHTML = "";
      appData.maps.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.name;
        if (m.id === appData.currentMapId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    // マップ切り替え 【1】
    function switchMap(mapId) {
      appData.currentMapId = mapId;
      saveLocalStorage();
      loadCurrentMapData();
    }

    function loadCurrentMapData() {
      // 描画クリア
      Object.keys(storeMarkers).forEach(k => leafletMap.removeLayer(storeMarkers[k]));
      Object.keys(areaCircles).forEach(k => leafletMap.removeLayer(areaCircles[k]));
      storeMarkers = {};
      areaCircles = {};

      const currentStores = appData.stores[appData.currentMapId] || [];
      const currentAreas = appData.areas[appData.currentMapId] || [];

      // エリア描画
      currentAreas.forEach(area => renderAreaOnMap(area));

      // 店舗ピン描画
      currentStores.forEach(store => renderStoreOnMap(store));
    }

    // エリアの描画
    function renderAreaOnMap(area) {
      const circle = L.circle([area.lat, area.lng], {
        color: 'red',
        fillColor: '#f03',
        fillOpacity: 0.2,
        radius: area.radius
      }).addTo(leafletMap);

      // <2> ポップアップ内容: 上から編集、削除、閉じる
      const popupDiv = document.createElement('div');
      popupDiv.innerHTML = `
        <strong>${escapeHtml(area.name)}</strong><br>
        <div style="display:flex; flex-direction:column; gap:4px; margin-top:8px;">
          <button onclick="openEditArea('${area.id}')">編集</button>
          <button onclick="deleteArea('${area.id}')" style="background:#dc3545; color:white; border:none; padding:2px 4px; border-radius:2px;">削除</button>
          <button onclick="leafletMap.closePopup()">閉じる</button>
        </div>
      `;
      circle.bindPopup(popupDiv);
      areaCircles[area.id] = circle;
    }

    // 店舗の描画 【3】共有ボタン含む
    function renderStoreOnMap(store) {
      const marker = L.marker([store.lat, store.lng]).addTo(leafletMap);
      const popupDiv = document.createElement('div');
      popupDiv.innerHTML = `
        <strong>${escapeHtml(store.name)}</strong><br>
        ${escapeHtml(store.memo || '')}<br>
        <div style="display:flex; gap:4px; margin-top:8px;">
          <button onclick="openEditStore('${store.id}')">編集</button>
          <button onclick="deleteStore('${store.id}')" style="background:#dc3545; color:white; border:none; padding:2px 4px; border-radius:2px;">削除</button>
          <button onclick="openShareModal('${store.id}')" style="background:#28a745; color:white; border:none; padding:2px 4px; border-radius:2px;">共有</button>
        </div>
      `;
      marker.bindPopup(popupDiv);
      storeMarkers[store.id] = marker;
    }

    // モーダル制御
    function openModal(id) { document.getElementById(id).classList.add("active"); }
    function closeModal(id) { document.getElementById(id).classList.remove("active"); }

    // 【2】新規マップ作成
    function openNewMapModal() {
      if (appData.maps.length >= MAX_MAPS) {
        alert(`マップの登録上限（${MAX_MAPS}件）に達しています。`);
        return;
      }
      document.getElementById("newMapName").value = "";
      openModal("newMapModal");
    }

    function createMap() {
      const name = document.getElementById("newMapName").value.trim();
      if (!name) return alert("マップ名を入力してください。");
      const newId = "map_" + Date.now();
      appData.maps.push({ id: newId, name: name });
      appData.currentMapId = newId;
      saveLocalStorage();
      renderMapSelect();
      loadCurrentMapData();
      closeModal("newMapModal");
    }

    // 【1】マップ管理・編集・並び替え・削除
    function openMapManageModal() {
      renderMapManageList();
      openModal("mapManageModal");
    }

    function renderMapManageList() {
      const ul = document.getElementById("mapManageList");
      ul.innerHTML = "";
      appData.maps.forEach((m, idx) => {
        const li = document.createElement("li");
        li.className = "manage-item";
        li.innerHTML = `
          <input type="text" value="${escapeHtml(m.name)}" onchange="updateMapName('${m.id}', this.value)">
          <div class="actions">
            <button onclick="moveMap(${idx}, -1)">▲</button>
            <button onclick="moveMap(${idx}, 1)">▼</button>
            <button class="danger" onclick="deleteMap('${m.id}')">削除</button>
          </div>
        `;
        ul.appendChild(li);
      });
    }

    function updateMapName(id, newName) {
      const m = appData.maps.find(item => item.id === id);
      if (m && newName.trim()) {
        m.name = newName.trim();
        saveLocalStorage();
        renderMapSelect();
      }
    }

    function moveMap(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= appData.maps.length) return;
      const temp = appData.maps[index];
      appData.maps[index] = appData.maps[newIndex];
      appData.maps[newIndex] = temp;
      saveLocalStorage();
      renderMapSelect();
      renderMapManageList();
    }

    function deleteMap(id) {
      if (appData.maps.length <= 1) return alert("最後のマップは削除できません。");
      if (!confirm("このマップを削除しますか？")) return;
      appData.maps = appData.maps.filter(m => m.id !== id);
      delete appData.stores[id];
      delete appData.areas[id];
      if (appData.currentMapId === id) {
        appData.currentMapId = appData.maps[0].id;
      }
      saveLocalStorage();
      renderMapSelect();
      renderMapManageList();
      loadCurrentMapData();
    }

    // <4> エリア登録・管理
    function openAreaManageModal() {
      const center = leafletMap.getCenter();
      document.getElementById("newAreaName").value = "";
      document.getElementById("newAreaLat").value = center.lat.toFixed(6);
      document.getElementById("newAreaLng").value = center.lng.toFixed(6);
      renderAreaManageList();
      openModal("areaManageModal");
    }

    function addArea() {
      const currentAreas = appData.areas[appData.currentMapId] || [];
      if (currentAreas.length >= MAX_AREAS) {
        alert(`エリア登録上限（${MAX_AREAS}件）に達しています。`);
        return;
      }
      const name = document.getElementById("newAreaName").value.trim();
      const lat = parseFloat(document.getElementById("newAreaLat").value);
      const lng = parseFloat(document.getElementById("newAreaLng").value);
      const radius = parseFloat(document.getElementById("newAreaRadius").value);

      if (!name || isNaN(lat) || isNaN(lng) || isNaN(radius)) {
        return alert("正しく入力してください。");
      }

      const area = { id: "area_" + Date.now(), name, lat, lng, radius };
      if (!appData.areas[appData.currentMapId]) appData.areas[appData.currentMapId] = [];
      appData.areas[appData.currentMapId].push(area);

      saveLocalStorage();
      renderAreaOnMap(area);
      renderAreaManageList();
      document.getElementById("newAreaName").value = "";
    }

    function renderAreaManageList() {
      const ul = document.getElementById("areaManageList");
      ul.innerHTML = "";
      const currentAreas = appData.areas[appData.currentMapId] || [];
      currentAreas.forEach((area, idx) => {
        const li = document.createElement("li");
        li.className = "manage-item";
        li.innerHTML = `
          <input type="text" value="${escapeHtml(area.name)}" onchange="updateAreaName('${area.id}', this.value)">
          <div class="actions">
            <button onclick="moveArea(${idx}, -1)">▲</button>
            <button onclick="moveArea(${idx}, 1)">▼</button>
            <button class="danger" onclick="deleteArea('${area.id}')">削除</button>
          </div>
        `;
        ul.appendChild(li);
      });
    }

    function updateAreaName(id, newName) {
      const currentAreas = appData.areas[appData.currentMapId] || [];
      const area = currentAreas.find(a => a.id === id);
      if (area && newName.trim()) {
        area.name = newName.trim();
        saveLocalStorage();
        loadCurrentMapData();
      }
    }

    function moveArea(index, direction) {
      const currentAreas = appData.areas[appData.currentMapId] || [];
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= currentAreas.length) return;
      const temp = currentAreas[index];
      currentAreas[index] = currentAreas[newIndex];
      currentAreas[newIndex] = temp;
      saveLocalStorage();
      renderAreaManageList();
    }

    function deleteArea(id) {
      if (!confirm("エリアを削除しますか？")) return;
      let currentAreas = appData.areas[appData.currentMapId] || [];
      appData.areas[appData.currentMapId] = currentAreas.filter(a => a.id !== id);
      saveLocalStorage();
      if (areaCircles[id]) {
        leafletMap.removeLayer(areaCircles[id]);
        delete areaCircles[id];
      }
      renderAreaManageList();
    }

    function openEditArea(id) {
      const currentAreas = appData.areas[appData.currentMapId] || [];
      const area = currentAreas.find(a => a.id === id);
      if (!area) return;
      const newName = prompt("エリア名の変更", area.name);
      if (newName !== null && newName.trim() !== "") {
        area.name = newName.trim();
        saveLocalStorage();
        loadCurrentMapData();
      }
    }

    // <5> リスト管理（店舗表示アコーディオン形式）
    function openListManageModal() {
      const container = document.getElementById("accordionContainer");
      container.innerHTML = "";
      
      const currentStores = appData.stores[appData.currentMapId] || [];
      if (currentStores.length === 0) {
        container.innerHTML = "<p>登録されている店舗はありません。</p>";
      } else {
        currentStores.slice(0, MAX_LISTS).forEach(store => {
          const item = document.createElement("div");
          item.className = "accordion-item";
          item.innerHTML = `
            <div class="accordion-header" onclick="toggleAccordion(this)">
              <span>${escapeHtml(store.name)}</span>
              <span>▼</span>
            </div>
            <div class="accordion-content">
              <p><strong>緯度:</strong> ${store.lat}</p>
              <p><strong>経度:</strong> ${store.lng}</p>
              <p><strong>メモ:</strong> ${escapeHtml(store.memo || 'なし')}</p>
            </div>
          `;
          container.appendChild(item);
        });
      }
      openModal("listManageModal");
    }

    function toggleAccordion(header) {
      const item = header.parentElement;
      item.classList.toggle("open");
    }

    // 店舗追加・編集
    function openStoreModal() {
      const currentStores = appData.stores[appData.currentMapId] || [];
      if (currentStores.length >= MAX_STORES) {
        alert(`店舗登録上限（${MAX_STORES}件）に達しています。`);
        return;
      }
      document.getElementById("storeModalTitle").textContent = "店舗追加";
      document.getElementById("storeId").value = "";
      document.getElementById("storeName").value = "";
      const center = leafletMap.getCenter();
      document.getElementById("storeLat").value = center.lat.toFixed(6);
      document.getElementById("storeLng").value = center.lng.toFixed(6);
      document.getElementById("storeMemo").value = "";
      openModal("storeModal");
    }

    function openEditStore(id) {
      const currentStores = appData.stores[appData.currentMapId] || [];
      const store = currentStores.find(s => s.id === id);
      if (!store) return;
      document.getElementById("storeModalTitle").textContent = "店舗編集";
      document.getElementById("storeId").value = store.id;
      document.getElementById("storeName").value = store.name;
      document.getElementById("storeLat").value = store.lat;
      document.getElementById("storeLng").value = store.lng;
      document.getElementById("storeMemo").value = store.memo || "";
      openModal("storeModal");
    }

    function saveStore() {
      const id = document.getElementById("storeId").value;
      const name = document.getElementById("storeName").value.trim();
      const lat = parseFloat(document.getElementById("storeLat").value);
      const lng = parseFloat(document.getElementById("storeLng").value);
      const memo = document.getElementById("storeMemo").value.trim();

      if (!name || isNaN(lat) || isNaN(lng)) return alert("店舗名と緯度・経度は必須です。");

      if (!appData.stores[appData.currentMapId]) appData.stores[appData.currentMapId] = [];
      const currentStores = appData.stores[appData.currentMapId];

      if (id) {
        const store = currentStores.find(s => s.id === id);
        if (store) {
          store.name = name;
          store.lat = lat;
          store.lng = lng;
          store.memo = memo;
        }
      } else {
        currentStores.push({ id: "store_" + Date.now(), name, lat, lng, memo });
      }

      saveLocalStorage();
      closeModal("storeModal");
      loadCurrentMapData();
    }

    function deleteStore(id) {
      if (!confirm("店舗を削除しますか？")) return;
      let currentStores = appData.stores[appData.currentMapId] || [];
      appData.stores[appData.currentMapId] = currentStores.filter(s => s.id !== id);
      saveLocalStorage();
      loadCurrentMapData();
    }

    // 【3】他マップ共有機能
    function openShareModal(storeId) {
      currentShareStoreId = storeId;
      const container = document.getElementById("shareMapCheckboxes");
      container.innerHTML = "";

      const otherMaps = appData.maps.filter(m => m.id !== appData.currentMapId);
      if (otherMaps.length === 0) {
        container.innerHTML = "<p>共有可能な他のマップが存在しません。</p>";
      } else {
        otherMaps.forEach(m => {
          const div = document.createElement("div");
          div.innerHTML = `
            <label>
              <input type="checkbox" name="shareTargetMap" value="${m.id}"> ${escapeHtml(m.name)}
            </label>
          `;
          container.appendChild(div);
        });
      }
      openModal("shareModal");
    }

    function executeShare() {
      if (!currentShareStoreId) return;
      const currentStores = appData.stores[appData.currentMapId] || [];
      const storeToShare = currentStores.find(s => s.id === currentShareStoreId);
      if (!storeToShare) return;

      const checkedBoxes = document.querySelectorAll('input[name="shareTargetMap"]:checked');
      if (checkedBoxes.length === 0) return alert("共有先のマップを選択してください。");

      checkedBoxes.forEach(cb => {
        const targetMapId = cb.value;
        if (!appData.stores[targetMapId]) appData.stores[targetMapId] = [];
        
        // 上限チェック
        if (appData.stores[targetMapId].length < MAX_STORES) {
          appData.stores[targetMapId].push({
            id: "store_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
            name: storeToShare.name,
            lat: storeToShare.lat,
            lng: storeToShare.lng,
            memo: storeToShare.memo
          });
        }
      });

      saveLocalStorage();
      closeModal("shareModal");
      alert("選択したマップへ共有しました。");
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
