    function handleImageUploadStrict(e) {
      const files = Array.from(e.target.files);
      for (let file of files) {
        if (currentEditingImages.length >= 5) {
          alert('写真は最大5枚までです。');
          break;
        }
        if (!['image/jpeg', 'image/png'].includes(file.type)) {
          alert('JPGまたはPNG形式の画像のみアップロード可能です。');
          continue;
        }
        const reader = new FileReader();
        reader.onload = function(evt) {
          if (currentEditingImages.length < 5) {
            currentEditingImages.push(evt.target.result);
            renderImagePreviews();
          }
        };
        reader.readAsDataURL(file);
      }
    }

    function renderImagePreviews() {
      const box = document.getElementById('image-preview-container');
      if (!box) return;
      box.innerHTML = currentEditingImages.map((img, idx) => `
        <div class="preview-thumb">
          <img src="${img}">
          <button class="del-btn" onclick="removeImage(${idx})">✕</button>
        </div>
      `).join('');
    }

    function removeImage(idx) {
      currentEditingImages.splice(idx, 1);
      renderImagePreviews();
    }

    function saveStoreData(editStoreId = '') {
      const curMap = getCurrentMap();
      if (curMap.isShared) {
        alert('🔒 共有されたマップのため保存できません。');
        return;
      }

      const name = document.getElementById('reg-store-name').value.trim();
      if (!name) {
        alert('店舗名を入力してください。');
        return;
      }
      if (!curMap.lists) curMap.lists = [];

      const selectedListIds = Array.from(document.querySelectorAll('.reg-list-tag.selected')).map(el => el.dataset.value);

      const newListInputs = document.querySelectorAll('.new-list-input');
      newListInputs.forEach(input => {
        const val = input.value.trim();
        if (val) {
          if (curMap.lists.length < 50) {
            const newList = { id: 'lst_' + Date.now() + '_' + Math.floor(Math.random()*1000), name: val };
            curMap.lists.push(newList);
            selectedListIds.push(newList.id);
          }
        }
      });

      const storeData = {
        name: name,
        isFavorite: document.getElementById('reg-store-fav').value === 'true',
        listIds: selectedListIds,
        images: [...currentEditingImages],
        forms: getSelectedTagValues('reg-form'),
        genres: getSelectedTagValues('reg-genre'),
        form: getSelectedTagValues('reg-form')[0] || '',
        genre: getSelectedTagValues('reg-genre')[0] || '',
        budget: document.getElementById('reg-store-budget').value,
        options: Array.from(document.querySelectorAll('.reg-store-option:checked')).map(el => el.value),
        pinShape: document.getElementById('reg-store-pin-shape').value || 'heart',
        pinColor: document.getElementById('reg-store-pin-color').value || 'red',
        cospa: parseInt(document.getElementById('reg-store-cospa').value, 10),
        capa: parseInt(document.getElementById('reg-store-capa').value, 10),
        mood: parseInt(document.getElementById('reg-store-mood').value, 10),
        station: document.getElementById('reg-store-station').value.trim(),
        contact: document.getElementById('reg-store-contact').value.trim(),
        reserve: document.getElementById('reg-store-reserve').value.trim(),
        official: document.getElementById('reg-store-official').value.trim(),
        tabelog: document.getElementById('reg-store-tabelog').value.trim(),
        hotpepper: document.getElementById('reg-store-hotpepper').value.trim(),
        other: document.getElementById('reg-store-other').value.trim(),
        memo: document.getElementById('reg-store-memo').value
      };

      if (editStoreId) {
        const target = curMap.stores.find(s => s.id === editStoreId);
        if (target) Object.assign(target, storeData);
        saveStorage();
        closeModal();
        showStoreDetail(editStoreId);
      } else {
        const newStore = {
          id: 'str_' + Date.now(),
          lat: tempPinLocation.lat,
          lng: tempPinLocation.lng,
          ...storeData
        };
        curMap.stores.push(newStore);
        if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
        tempPinLocation = null;
        saveStorage();
        closeModal();
        showStoreDetail(newStore.id);
      }
    }

    function generateAreaListOptionsHtml(selectedIds = []) {
      const curMap = getCurrentMap();
      if (!curMap.areaLists || curMap.areaLists.length === 0) return '<div style="font-size:10px;color:#888;">エリアリストがありません。</div>';
      const selected = new Set(selectedIds || []);
      return curMap.areaLists.map(l => `
        <label style="display:flex;align-items:center;gap:5px;font-size:10.5px;margin:3px 0;cursor:pointer;">
          <input type="checkbox" class="existing-area-list-check" value="${l.id}" ${selected.has(l.id) ? 'checked' : ''}>
          <span>📁 ${l.name}</span>

    }

    function createAreaListAndSelect() {
      const curMap = getCurrentMap();
      if (curMap.isShared) return;
      const input = document.getElementById('new-area-list-name');
      const name = input ? input.value.trim() : '';
      if (!name) { alert('エリアリスト名を入力してください。'); return; }
      if (!curMap.areaLists) curMap.areaLists = [];
      if (curMap.areaLists.length >= 50) { alert('⚠️ エリアリスト上限数（50個）に達しています。'); return; }
      const newList = { id:'alst_' + Date.now() + '_' + Math.floor(Math.random()*1000), name, areaIds:[] };
      curMap.areaLists.push(newList);
      saveStorage();
      openAreaRegisterModalPrompt();
      setTimeout(() => {
        const cb = document.querySelector(`.existing-area-list-check[value="${newList.id}"]`);
        if (cb) cb.checked = true;
      }, 0);
    }

    function saveNewArea() {
      const curMap = getCurrentMap();
      if (curMap.isShared) {
        alert('🔒 共有されたマップのため操作できません。');
        return;
      }

      if (!tempPinLocation) {
        alert('先に地図上でエリアの中心となる場所をタップしてください。');
        return;
      }
      const name = document.getElementById('reg-area-name').value.trim();
      if (!name) {
        alert('エリア名を入力してください。');
        return;
      }

      if (!curMap.areas) curMap.areas = [];
      if (curMap.areas.length >= 100) {
        alert('⚠️ エリアの登録上限数（100件）に達しています。');
        return;
      }

      const selectedAreaListIds = Array.from(document.querySelectorAll('.existing-area-list-check:checked')).map(el => el.value);
      const newAreaListName = (document.getElementById('new-area-list-name')?.value || '').trim();
      if (newAreaListName) {
        if (!curMap.areaLists) curMap.areaLists = [];
        if (curMap.areaLists.length >= 50) {
          alert('⚠️ エリアリスト上限数（50個）に達しています。');
          return;
        }
        const newList = { id: 'alst_' + Date.now() + '_' + Math.floor(Math.random()*1000), name: newAreaListName, areaIds: [] };
        curMap.areaLists.push(newList);
        selectedAreaListIds.push(newList.id);
      }
      const newAreaId = 'area_' + Date.now() + '_' + Math.floor(Math.random()*1000);
      curMap.areas.push({
        id: newAreaId,
        name: name,
        color: 'teal',
        lat: tempPinLocation.lat,
        lng: tempPinLocation.lng,
        listIds: [...new Set(selectedAreaListIds)]
      });
      curMap.areaLists.forEach(l => {
        if (selectedAreaListIds.includes(l.id)) {
          if (!Array.isArray(l.areaIds)) l.areaIds = [];
          l.areaIds.push(newAreaId);
        }
      });

      if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
      tempPinLocation = null;

      saveStorage();
      renderCurrentMap();
      openAreaRegisterModalPrompt();
    }

    function editAreaName(areaId) {
      const curMap = getCurrentMap();
      if (curMap.isShared) { alert('🔒 共有されたマップのため操作できません。'); return; }
      const area = curMap.areas.find(a => a.id === areaId);
      if (!area) return;
      const newName = prompt('エリア名を変更:', area.name);
      if (newName && newName.trim()) {
        area.name = newName.trim();
        saveStorage();
        openAreaRegisterModalPrompt();
      }
    }

    function moveAreaToNo(areaId) {
      const curMap = getCurrentMap();
      if (curMap.isShared) return;
      const currentIndex = curMap.areas.findIndex(a => a.id === areaId);
      if (currentIndex < 0) return;
      const currentNo = currentIndex + 1;
      const input = prompt(`「${curMap.areas[currentIndex].name}」を何番目に移動しますか？\n現在: No.${currentNo} / 範囲: No.1～No.${curMap.areas.length}`, String(currentNo));
      if (input === null) return;
      const targetNo = parseInt(input, 10);
      if (!Number.isInteger(targetNo) || targetNo < 1 || targetNo > curMap.areas.length) {
        alert(`No.は1～${curMap.areas.length}の範囲で指定してください。`);
        return;
      }
      const targetIndex = targetNo - 1;
      if (targetIndex === currentIndex) return;
      const [moved] = curMap.areas.splice(currentIndex, 1);
      curMap.areas.splice(targetIndex, 0, moved);
      saveStorage();
      openAreaRegisterModalPrompt();
    }

    /* 登録店舗ピン表示と共有機能 */
    function getNearestStoreOrder(storeId) {
      const curMap = getCurrentMap();
      const stores = (curMap && curMap.stores ? curMap.stores : []).filter(s =>
        s && Number.isFinite(Number(s.lat)) && Number.isFinite(Number(s.lng))
      );
      const current = stores.find(s => s.id === storeId);
      if (!current) return [];
      const lat0 = Number(current.lat) * Math.PI / 180;
      const lng0 = Number(current.lng) * Math.PI / 180;
      const cosLat = Math.cos(lat0);
      return stores.map(s => {
        const lat = Number(s.lat) * Math.PI / 180;
        const lng = Number(s.lng) * Math.PI / 180;
        const dx = (lng - lng0) * cosLat;
        const dy = lat - lat0;
        return { store:s, distance: Math.sqrt(dx*dx + dy*dy) };
      }).sort((a,b) => a.distance - b.distance).map(x => x.store);
    }

    function switchToNearbyStore(storeId, direction) {
      const order = getNearestStoreOrder(storeId);
      if (order.length < 2) return;
      const currentIndex = order.findIndex(s => s.id === storeId);
      if (currentIndex < 0) return;
      let nextIndex = currentIndex + (direction < 0 ? -1 : 1);
      // 現在店は常にNo.0、そこから近い順に巡回する。
      if (nextIndex < 0) nextIndex = order.length - 1;
      if (nextIndex >= order.length) nextIndex = 0;
      const nextStore = order[nextIndex];
      if (nextStore) showStoreDetail(nextStore.id);
    }

    function getNearestStoreDistanceText(storeId) {
      const order = getNearestStoreOrder(storeId);
      if (order.length < 2) return '';
      const current = order[0];
      const next = order[1];
      const lat1 = Number(current.lat) * Math.PI / 180;
      const lat2 = Number(next.lat) * Math.PI / 180;
      const dLat = lat2 - lat1;
      const dLng = (Number(next.lng) - Number(current.lng)) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
      const meters = 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return `${Math.round(meters)}m先: ${next.name}`;
    }

    function reflectStoreToMyMap(storeId) {
      const curMap = getCurrentMap();
      const store = curMap.stores.find(s => s.id === storeId);
      if (!store) return;

      const myMaps = maps.filter(m => !m.isShared);
      if (myMaps.length === 0) {
        alert('⚠️ 自作のマップが見つかりません。新規マップを作成してください。');
        return;
      }

      const targetMapId = prompt(`店舗「${store.name}」をどの自作マップに反映しますか？\n(対象のマップIDを入力してください)\n\n利用可能なマップ:\n` + myMaps.map(m => `${m.name} [ID: ${m.id}]`).join('\n'), myMaps[0].id);

      if (!targetMapId) return;
      const targetMap = myMaps.find(m => m.id === targetMapId.trim());
      if (!targetMap) {
        alert('⚠️ 指定されたマップが見つかりません。');
        return;
      }

      if (!targetMap.stores) targetMap.stores = [];
      if (targetMap.stores.length >= 200) {
        alert('⚠️ 対象のマップが店舗上限数（200件）に達しています。');
        return;
      }

      const copiedStore = JSON.parse(JSON.stringify(store));
      copiedStore.id = 'str_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      targetMap.stores.push(copiedStore);
      saveStorage();
      alert(`🎉 マップ「${targetMap.name}」に店舗情報を反映しました！`);
    }

    function filterStores() {
      const nameVal = document.getElementById('search-name').value.toLowerCase();
      const listVal = document.getElementById('search-list').value;
      const favOnly = document.getElementById('search-fav-only')?.checked || false;
      const formVal = document.getElementById('search-form').value;
      const genreVal = document.getElementById('search-genre').value;
      const budgetVal = document.getElementById('search-budget').value;
      const stationVal = document.getElementById('search-station').value.trim().toLowerCase();
      const optionVals = Array.from(document.querySelectorAll('.search-option-check:checked')).map(el => el.value);

      const curMap = getCurrentMap();
      const filtered = (curMap.stores || []).filter(s => {
        if (nameVal && !s.name.toLowerCase().includes(nameVal)) return false;
        if (stationVal && !(s.station || '').toLowerCase().includes(stationVal)) return false;
        if (listVal && !(s.listIds || []).includes(listVal) && s.listId !== listVal) return false;
        if (favOnly && !s.isFavorite) return false;
        const storeForms = getStoreForms(s);
        const storeGenres = getStoreGenres(s);
        if (formVal && !storeForms.includes(formVal)) return false;
        if (genreVal && !storeGenres.includes(genreVal)) return false;
        if (budgetVal && s.budget !== budgetVal) return false;
        const storeOptions = getStoreOptions(s);
        if (optionVals.length && !optionVals.every(v => storeOptions.includes(v))) return false;
        return true;
      });

      const resultsPanel = document.getElementById('search-results-panel');
      const container = document.getElementById('search-results-container');
      
      resultsPanel.style.display = 'block';
      const countEl = document.getElementById('search-results-count');
      if (countEl) countEl.textContent = `一致：${filtered.length}店舗`;

      if (filtered.length === 0) {
        container.innerHTML = `<p style="font-size:11px; color:#888; text-align:center; padding:10px 0;">該当する店舗が見つかりません</p>`;
        return;
      }

      container.innerHTML = filtered.map(s => `
        <div style="padding:6px 8px; margin-top:4px; background:rgba(0,0,0,0.03); border-radius:6px; cursor:pointer; border-left:3px solid var(--primary-color);" onclick="showStoreDetail('${s.id}')">

    async function copyShareCode() {
      const input = document.getElementById('custom-share-code');
      const successEl = document.getElementById('share-code-success');
      const errorEl = document.getElementById('share-code-error');
      if (!input) return;
      const code = input.value.trim();
      if (!code) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(code);
        } else {
          input.focus(); input.select(); document.execCommand('copy');
          input.setSelectionRange(input.value.length, input.value.length);
        }
        if (errorEl) errorEl.style.display = 'none';
        if (successEl) { successEl.textContent = '✅ 共有コードをコピーしました。'; successEl.style.display = 'block'; }
      } catch (e) {
        if (successEl) successEl.style.display = 'none';
        if (errorEl) { errorEl.textContent = '⚠️ コピーできませんでした。手動でコピーしてください。'; errorEl.style.display = 'block'; }
      }
    }

    function getJapaneseFirebaseError(error, fallback = '処理に失敗しました。') {
      if (!error) return fallback;
      const code = error.code || '';
      const message = String(error.message || '');
      const map = {
        'PERMISSION_DENIED': 'Firebaseの権限設定により、この操作が拒否されました。Realtime Database の Security Rules で「sharedMaps」と「invalidSharedCodes」の所有者書き込みを許可してください。',
        'permission_denied': 'Firebaseの権限設定により、この操作が拒否されました。Realtime Database の Security Rules を確認してください。',
        'auth/requires-recent-login': 'セキュリティ確認のため、いったんログインし直してからお試しください。',
        'auth/network-request-failed': '通信に失敗しました。ネットワーク接続を確認してください。',
        'NETWORK_ERROR': 'Firebaseとの通信に失敗しました。ネットワーク接続を確認してください。'
      };
      if (map[code]) return map[code];
      if (/PERMISSION_DENIED|permission denied/i.test(message)) return map.PERMISSION_DENIED;
      if (/network/i.test(message)) return map.NETWORK_ERROR;
      return message || fallback;
    }

    async function saveCustomShareCode() {
      const curMap = getCurrentMap();
      if (!curMap || curMap.isShared) return;
      if (!currentUser.loggedIn || !currentUser.uid || !auth.currentUser) {
        const errorEl = document.getElementById('share-code-error');
        if (errorEl) { errorEl.textContent = '🔐 共有コードを発行するにはログインしてください。'; errorEl.style.display = 'block'; }
        return;
      }
      const input = document.getElementById('custom-share-code');
      const errorEl = document.getElementById('share-code-error');
      const successEl = document.getElementById('share-code-success');
      if (!input || !errorEl || !successEl) return;
      const newCode = input.value.trim();
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (newCode.length < 6 || newCode.length > 20) {
        errorEl.textContent = '⚠️ 共有コードは6〜20文字で入力してください。'; errorEl.style.display = 'block'; return;
      }
      if (!/^[a-zA-Z0-9]+$/.test(newCode)) {
        errorEl.textContent = '⚠️ 記号や全角文字は使用できません。半角英字と数字のみ使用してください。'; errorEl.style.display = 'block'; return;
      }
      if (!/[a-zA-Z]/.test(newCode) || !/[0-9]/.test(newCode)) {
        errorEl.textContent = '⚠️ 半角英字と数字の両方を使用してください。'; errorEl.style.display = 'block'; return;
      }

      try {
        // ボタン押下直後に状態表示を更新し、発行処理の完了後に「発行済み / 更新なし」へ切り替える。
        const statusBox = document.getElementById('share-code-status-box');
        const statusText = document.getElementById('share-code-status-text');
        const statusNote = statusBox ? statusBox.querySelector('[data-share-status-note]') : null;
        if (statusBox) statusBox.className = 'share-code-status-box updating';
        if (statusText) statusText.textContent = '現在の状態：🟠 更新処理中…';
        if (statusNote) statusNote.textContent = '共有データを最新状態へ更新しています。';

        // コード変更時は旧コードを無効化してから、新コードを発行する。
        if (curMap.shareCode && curMap.shareCode !== newCode) {
          const oldCode = curMap.shareCode;
          try {
            await database.ref(`sharedMaps/${oldCode}`).remove();
            await database.ref(`invalidSharedCodes/${oldCode}`).set({
              ownerUid: currentUser.uid,
              reason: '共有コードが変更されたため、このコードは無効になりました。',
              replacedBy: newCode,
              invalidatedAt: firebase.database.ServerValue.TIMESTAMP
            });
          } catch (oldError) {
            throw new Error('以前の共有コードを無効化できませんでした。FirebaseのSecurity Rulesを確認してください。');
          }
          curMap.shareCode = '';
          curMap.shareSnapshot = '';
        }

        await publishShareCode(curMap, newCode);

        // 共有データ自体の発行に成功した後、ユーザーデータも保存する。
        // users 側の保存が失敗しても、発行済みコードそのものはFirebase上に残るため、
        // 画面には「発行成功＋ユーザーデータ保存警告」として表示する。
        let userSaveWarning = '';
        try {
          await saveStorage(false);
        } catch (saveError) {
          console.error('共有コード発行後のユーザーデータ保存失敗:', saveError);
          userSaveWarning = '（クラウド側のユーザーデータ保存に失敗しました。Firebaseのusersルールを確認してください）';
          // クラウド保存に失敗しても、この端末では発行状態を保持する。
          try {
            users = JSON.parse(localStorage.getItem('gourmet_users')) || {};
            users[currentUser.uid] = {
              name: currentUser.name || 'ユーザー', email: currentUser.email || '',
              maps: JSON.parse(JSON.stringify(maps || [])), currentMapId: currentMapId || ''
            };
            localStorage.setItem('gourmet_users', JSON.stringify(users));
            localStorage.setItem(`gourmet_user_maps_${currentUser.uid}`, JSON.stringify(maps));
            localStorage.setItem(`gourmet_user_map_id_${currentUser.uid}`, currentMapId || '');
          } catch (localError) { console.warn('共有コード状態のローカル保存にも失敗:', localError); }
        }

        successEl.textContent = `🎉 共有コード「${curMap.shareCode}」を更新しました。現在「発行済み・更新なし」です。複数人で同じコードを利用できます。${userSaveWarning}`;
        successEl.style.display = 'block';
        errorEl.style.display = 'none';
        if (statusBox) { statusBox.style.borderColor = '#28a745'; statusBox.style.background = 'rgba(40,167,69,.10)'; }
        if (statusText) statusText.textContent = '現在の状態：🟢 発行済み / 更新なし';
        if (statusNote) statusNote.innerHTML = `発行済みコード：<b>${curMap.shareCode}</b>`;
        input.value = curMap.shareCode;
        updateShareCodeStatus();
      } catch (e) {
        console.error('共有コード発行失敗:', e);
        errorEl.textContent = '⚠️ ' + getJapaneseFirebaseError(e, '共有コードの発行に失敗しました。');
        errorEl.style.display = 'block';
        successEl.style.display = 'none';
      }
    }

    async function importCodePrompt() {
      toggleMenu();
      const code = prompt('読み込む共有コードを入力してください:');
      if (!code || !code.trim()) return;
      const trimmed = code.trim();
      if (trimmed.length < 6 || trimmed.length > 20 || !/[a-zA-Z]/.test(trimmed) || !/[0-9]/.test(trimmed) || !/^[a-zA-Z0-9]+$/.test(trimmed)) {
        alert('⚠️ 共有コードは「数字と半角英字の組み合わせ（6〜20文字）」です。');
        return;
      }

      try {
        const result = await readSharedCode(trimmed);
        if (result.status === 'invalid') {
          alert(`🚫 この共有コードは古いコードのため拒否されました。\n\n⚠️ ${result.data?.reason || '共有元の情報が更新されたため無効になっています。'}\n\n共有元から新しい共有コードを取得してください。`);
          return;
        }
        if (result.status !== 'valid' || !result.data) {
          // 旧バージョンとの互換用に、この端末のlocalStorageも確認。
          sharedStoreDB = JSON.parse(localStorage.getItem('gourmet_shared_maps')) || {};
          const legacy = sharedStoreDB[trimmed];
          if (!legacy) {
            alert('⚠️ 指定された共有コードのマップが見つかりませんでした。コードを確認してください。');
            return;
          }
          result.data = legacy;
        }

        const targetMapData = result.data;
        const sharedMap = {
          id: 'shared_' + trimmed,
          sourceShareCode: trimmed,
          name: `${targetMapData.name} (共有)`,
          stores: JSON.parse(JSON.stringify(targetMapData.stores || [])),
          areas: JSON.parse(JSON.stringify(targetMapData.areas || [])),
          lists: JSON.parse(JSON.stringify(targetMapData.lists || [])),
          areaLists: JSON.parse(JSON.stringify(targetMapData.areaLists || [])),
          isShared: true,
          shareVersion: targetMapData.version || 1
        };
        const existingIndex = maps.findIndex(m => m.isShared && m.sourceShareCode === trimmed);
        if (existingIndex >= 0) maps[existingIndex] = sharedMap;
        else maps.push(sharedMap);
        currentMapId = sharedMap.id;
        saveStorage();
        closeDetailPanel(); closeSearchResultsPanel();
        alert(`🎉 共有コード「${trimmed}」を読み込みました。\n（このコードは時間制限なしで利用できます）`);
      } catch (e) {
        console.error('共有コード読み込み失敗:', e);
        alert('⚠️ 共有コードを読み込めませんでした。Firebaseの接続・Security Rulesを確認してください。');
      }
    }

    async function refreshSharedMap() {
      toggleMenu();
      const curMap = getCurrentMap();
      if (!curMap.isShared || !curMap.sourceShareCode) {
        alert('ℹ️ 現在のマップは共有マップではありません。');
        return;
      }
      try {
        const result = await readSharedCode(curMap.sourceShareCode);
        if (result.status === 'invalid') {
          alert(`🚫 この共有コードは古いコードのため更新できません。\n\n⚠️ ${result.data?.reason || '共有元の情報が更新されたため無効になっています。'}\n\n共有元から新しいコードを取得してください。`);
          return;
        }
        if (result.status !== 'valid' || !result.data) {
          alert('⚠️ 共有コードのデータが見つかりません。');
          return;
        }
        const latestData = result.data;
        curMap.name = `${latestData.name} (共有)`;
        curMap.stores = JSON.parse(JSON.stringify(latestData.stores || []));
        curMap.areas = JSON.parse(JSON.stringify(latestData.areas || []));
        curMap.lists = JSON.parse(JSON.stringify(latestData.lists || []));
        curMap.shareVersion = latestData.version || curMap.shareVersion;
        saveStorage();
        closeDetailPanel(); closeSearchResultsPanel();
        alert('🔄 共有元の最新データに更新しました。');
      } catch (e) {
        console.error(e);
        alert('⚠️ 共有マップの更新に失敗しました。');
      }
    }

      closeSearchResultsPanel();

    function editMapName(mapId) {
      const targetMap = maps.find(m => m.id === mapId);
      if (!targetMap) return;
      const newName = prompt('マップ名を編集:', targetMap.name);
      if (newName && newName.trim()) {
        targetMap.name = newName.trim();
        saveStorage();
        openMapSwitchModal();

    function moveMapOrder(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= maps.length) return;
      const temp = maps[index];
      maps[index] = maps[targetIndex];
      maps[targetIndex] = temp;
      saveStorage();
      openMapSwitchModal();
    }

    function deleteMap(mapId) {
      if (maps.length <= 1) {
        alert('⚠️ マップは最低1つ必要なため削除できません。');
        return;
      }
      if (!confirm('このマップをリストから削除しますか？')) return;
      
      maps = maps.filter(m => m.id !== mapId);
      if (currentMapId === mapId) {
        currentMapId = maps[0].id;
      }
      saveStorage();
      openMapSwitchModal();
      closeDetailPanel();
    }

    function moveCustomList(index, direction) {
      const curMap = getCurrentMap();

      if (targetIndex < 0 || targetIndex >= curMap.lists.length) return;
      const temp = curMap.lists[index];
      curMap.lists[index] = curMap.lists[targetIndex];
      curMap.lists[targetIndex] = temp;
      saveStorage();
      openCustomListModal();
    }

    function editCustomListName(listId) {

    function moveStoreInList(listId, storeId) {
      const curMap = getCurrentMap();
      if (curMap.isShared) return;
      const assignedStores = (curMap.stores || []).filter(s => (s.listIds || []).includes(listId) || s.listId === listId);
      const currentIndex = assignedStores.findIndex(s => s.id === storeId);
      if (currentIndex < 0) return;
      const currentNo = currentIndex + 1;
      const store = assignedStores[currentIndex];
      const input = prompt(`「${store.name}」を何番目に移動しますか？\n現在: No.${currentNo} / 範囲: No.1～No.${assignedStores.length}`, String(currentNo));
      if (input === null) return;
      const targetNo = parseInt(input, 10);
      if (!Number.isInteger(targetNo) || targetNo < 1 || targetNo > assignedStores.length) {
        alert(`No.は1～${assignedStores.length}の範囲で指定してください。`);
        return;
      }
      const targetIndex = targetNo - 1;
      if (targetIndex === currentIndex) return;

      // リスト内では「入れ替え」ではなく、指定Noへ割り込ませる。
      // 実データは店舗配列を、リスト内の並びを保ったまま組み替える。
      const idxA = curMap.stores.findIndex(s => s.id === storeId);
      if (idxA < 0) return;
      const targetStore = assignedStores[targetIndex];
      const idxTarget = curMap.stores.findIndex(s => s.id === targetStore.id);
      if (idxTarget < 0) return;

      const [moved] = curMap.stores.splice(idxA, 1);
      const adjustedTargetIndex = curMap.stores.findIndex(s => s.id === targetStore.id);
      if (adjustedTargetIndex < 0) return;
      curMap.stores.splice(adjustedTargetIndex, 0, moved);

      saveStorage();
      openCustomListModal();
      toggleListAccordion('list-stores-' + listId);
    }

    function removeStoreFromList(listId, storeId) {
      const curMap = getCurrentMap();
      if (curMap.isShared) return;
      const store = curMap.stores.find(s => s.id === storeId);
      if (store) {
        if (store.listIds) store.listIds = store.listIds.filter(id => id !== listId);
        if (store.listId === listId) store.listId = '';
        saveStorage();
        openCustomListModal();
        toggleListAccordion('list-stores-' + listId);
      }
    }

    function updateAuthUI() {
      const statusElem = document.getElementById('auth-status');
      const btnElem = document.getElementById('auth-btn');
      const editProfileBtn = document.getElementById('btn-edit-profile');
      const changePassBtn = document.getElementById('btn-change-pass');

    function getSavedAuthInput(key) {
      try { return sessionStorage.getItem(key) || ''; } catch (e) { return ''; }
    }
    function saveAuthInputs(email, pass) {
      try {
        sessionStorage.setItem('gourmet_login_email', email || '');
        sessionStorage.setItem('gourmet_login_password', pass || '');
      } catch (e) {}
    }

    function openAuthModal() {
      toggleMenu();
      const content = document.getElementById('modal-content');
      document.getElementById('modal-overlay').style.display = 'flex';
      const savedEmail = getSavedAuthInput('gourmet_login_email');
      const savedPass = getSavedAuthInput('gourmet_login_password');
      content.innerHTML = `
        <div class="modal-header"><h3>アカウント ログイン / 登録</h3></div>
        <div class="form-group"><label>メールアドレス</label><input type="email" id="auth-email" class="stylish-input" value="${savedEmail.replace(/"/g,'&quot;')}" autocomplete="email"></div>
        <div class="form-group"><label>パスワード</label><input type="password" id="auth-pass" class="stylish-input" value="${savedPass.replace(/"/g,'&quot;')}" autocomplete="current-password"></div>
        <div style="text-align:right; margin-bottom:8px;">
          <a href="javascript:void(0)" onclick="sendForgotOtp()" style="font-size:11px; color:var(--primary-color); text-decoration:underline;">パスワードを忘れた場合</a>
        </div>
        <div class="btn-group">
          <button onclick="handleAuth(false)">ログイン</button>
          <button onclick="handleAuth(true)" style="background: linear-gradient(135deg, #4ecdc4, #2ab7ca);">新規登録</button>
          <button onclick="closeModal()" class="btn-secondary">閉じる</button>
        </div>
        <p style="font-size:10px;color:#777;margin-top:8px;">※新規登録では、メールアドレスとパスワード入力後にアカウント名を登録します。</p>
      `;
    }

    function sendForgotOtp() {
      const emailInput = document.getElementById('auth-email');
      const email = emailInput ? emailInput.value.trim() : '';
      if (!email) { alert('先にメールアドレスを入力してください。'); return; }
      saveAuthInputs(email, document.getElementById('auth-pass')?.value || '');
      auth.languageCode = 'ja';
      auth.sendPasswordResetEmail(email)
        .then(() => {
          alert(`📩 ${email} 宛にパスワード再設定メールを送信しました。\n\n届かない場合は、迷惑メールフォルダとFirebase Authenticationのメールテンプレート設定をご確認ください。`);
        })
        .catch((error) => {
          console.error('password reset error:', error);
          const messages = {
            'auth/invalid-email': 'メールアドレスの形式が正しくありません。',
            'auth/too-many-requests': '短時間に送信しすぎています。少し時間を置いて再度お試しください。',
            'auth/network-request-failed': '通信に失敗しました。ネットワーク接続を確認してください。'
          };
          alert('⚠️ パスワード再設定メールを送信できませんでした。\n' + (messages[error.code] || error.message));
        });
    }

    function handleAuth(isRegister) {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-pass').value;
      if (!email || pass.length < 6) { alert('正しいメールアドレスと6文字以上のパスワードを入力してください。'); return; }
      saveAuthInputs(email, pass);

      if (isRegister) {
        auth.createUserWithEmailAndPassword(email, pass)
          .then((userCredential) => {
            const user = userCredential.user;
            currentUser = { loggedIn: true, email: user.email, name: '', uid: user.uid };
            // FirebaseのAuth状態反映後、アカウント名だけを続けて登録させる。
            openAccountNameSetupModal(user);
          })
          .catch((error) => {
            const messages = {
              'auth/email-already-in-use': 'このメールアドレスはすでに登録されています。',
              'auth/invalid-email': 'メールアドレスの形式が正しくありません。',
              'auth/weak-password': 'パスワードが弱すぎます。6文字以上で設定してください。'
            };
            alert('⚠️ 登録エラー: ' + (messages[error.code] || error.message));
          });
      } else {
        auth.signInWithEmailAndPassword(email, pass)
          .then((userCredential) => {
            const user = userCredential.user;
            currentUser = { loggedIn: true, email: user.email, name: user.displayName || user.email.split('@')[0], uid: user.uid };
            return loadCurrentUserData();
          })
          .then(() => {
            updateAuthUI(); renderCurrentMap(); closeModal();
            alert('🎉 Firebaseログインに成功しました！');
          })
          .catch((error) => {
            console.error('login error:', error);
            alert('⚠️ ログインエラー: メールアドレスまたはパスワードが正しくありません。');
          });
      }
    }

    function openAccountNameSetupModal(user) {
      const content = document.getElementById('modal-content');
      document.getElementById('modal-overlay').style.display = 'flex';
      content.innerHTML = `
        <div class="modal-header"><h3>👤 アカウント名の登録</h3></div>
        <p style="font-size:11px;color:#666;line-height:1.5;margin-bottom:10px;">メールアドレスとパスワードの登録が完了しました。最後に表示用のアカウント名を設定してください。</p>
        <div class="form-group"><label>アカウント名*</label><input type="text" id="setup-account-name" class="stylish-input" placeholder="例: グルメ太郎" autofocus></div>
        <div class="btn-group">
          <button onclick="completeAccountNameSetup()">登録完了</button>
        </div>
      `;
      window.pendingAccountSetupUid = user.uid;
    }

    async function completeAccountNameSetup() {
      const name = document.getElementById('setup-account-name').value.trim();
      if (!name) { alert('アカウント名を入力してください。'); return; }
      const user = auth.currentUser;
      if (!user || user.uid !== window.pendingAccountSetupUid) { alert('アカウント情報を確認できませんでした。'); return; }
      try {
        await user.updateProfile({ displayName: name });
        currentUser = { loggedIn: true, email: user.email, name, uid: user.uid };
        if (!maps || !maps.length) {
          const defaultMap = createDefaultMap(); maps = [defaultMap]; currentMapId = defaultMap.id;
        }
        await saveStorage();
        updateAuthUI(); closeModal(); renderCurrentMap();
        window.pendingAccountSetupUid = null;
        alert(`🎉 アカウント登録が完了しました。ようこそ、${name}さん。`);
      } catch (error) {
        alert('⚠️ アカウント名の登録に失敗しました: ' + error.message);
      }
    }

    function openEditProfileModal() {
      toggleMenu();
      const content = document.getElementById('modal-content');
      document.getElementById('modal-overlay').style.display = 'flex';
      content.innerHTML = `
        <div class="modal-header"><h3>✏️ アカウント名の変更</h3></div>
        <div class="form-group"><label>新しいアカウント名</label><input type="text" id="new-account-name" class="stylish-input" value="${currentUser.name}"></div>
        <div class="btn-group">
          <button onclick="saveAccountName()">保存</button>
          <button onclick="closeModal()" class="btn-secondary">キャンセル</button>
        </div>
      `;
    }

    // Firebase Auth: プロフィール名更新
    function saveAccountName() {
      const newName = document.getElementById('new-account-name').value.trim();
      if (!newName) {
        alert('アカウント名を入力してください。');
        return;
      }
      const user = auth.currentUser;
      if (user) {
        user.updateProfile({ displayName: newName }).then(() => {
          currentUser.name = newName;
          saveStorage();
          updateAuthUI();
          closeModal();
          alert('アカウント名を更新しました。');
        }).catch((error) => {
          alert('⚠️ 更新エラー: ' + error.message);
        });
      } else {
        currentUser.name = newName;
        saveStorage();
        updateAuthUI();
        closeModal();
      }
    }

    function openChangeEmailModal() {
      toggleMenu();
      const content = document.getElementById('modal-content');
      document.getElementById('modal-overlay').style.display = 'flex';
      content.innerHTML = `
        <div class="modal-header"><h3>✉️ メールアドレスの変更</h3></div>
        <p style="font-size:10.5px;color:#777;line-height:1.5;margin-bottom:8px;">安全確認のため現在のパスワードを入力します。変更先アドレスには確認メールが送られます。</p>
        <div class="form-group"><label>新しいメールアドレス</label><input type="email" id="new-email" class="stylish-input" value="${(currentUser.email || '').replace(/"/g,'&quot;')}" autocomplete="email"></div>
        <div class="form-group"><label>現在のパスワード</label><input type="password" id="email-change-pass" class="stylish-input" autocomplete="current-password"></div>
        <div class="btn-group">
          <button onclick="saveNewEmail()">確認メールを送る</button>
          <button onclick="closeModal()" class="btn-secondary">キャンセル</button>
        </div>
      `;
    }

    async function saveNewEmail() {
      const newEmail = document.getElementById('new-email').value.trim();
      const currentPass = document.getElementById('email-change-pass').value;
      if (!newEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) { alert('正しいメールアドレスを入力してください。'); return; }
      if (!currentPass) { alert('現在のパスワードを入力してください。'); return; }
      const user = auth.currentUser;
      if (!user) return;
      if (newEmail.toLowerCase() === (user.email || '').toLowerCase()) { alert('現在と同じメールアドレスです。'); return; }
      try {
        const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPass);
        await user.reauthenticateWithCredential(credential);
        auth.languageCode = 'ja';
        const actionSettings = { url: window.location.href, handleCodeInApp: false };
        if (typeof user.verifyBeforeUpdateEmail === 'function') {
          await user.verifyBeforeUpdateEmail(newEmail, actionSettings);
          alert(`📩 ${newEmail} 宛に確認メールを送信しました。\nメール内の確認操作が完了すると新しいアドレスへ変更されます。`);
        } else {
          await user.updateEmail(newEmail);
          currentUser.email = newEmail;
          await saveStorage();
          alert('✉️ メールアドレスを変更しました。');
        }
        closeModal();
      } catch (error) {
        console.error('email update error:', error);
        const messages = {
          'auth/wrong-password': '現在のパスワードが正しくありません。',
          'auth/invalid-credential': '現在のパスワードが正しくありません。',
          'auth/requires-recent-login': '再認証に失敗しました。いったんログインし直してください。',
          'auth/email-already-in-use': '変更先のメールアドレスはすでに使用されています。',
          'auth/invalid-email': '変更先メールアドレスの形式が正しくありません。'
        };
        alert('⚠️ メールアドレス変更に失敗しました。\n' + (messages[error.code] || error.message));
      }
    }

    function openChangePasswordModal() {
      toggleMenu();
      const content = document.getElementById('modal-content');
      document.getElementById('modal-overlay').style.display = 'flex';
      content.innerHTML = `
        <div class="modal-header"><h3>🔑 パスワードの変更</h3></div>
        <div class="form-group"><label>新しいパスワード (6文字以上)</label><input type="password" id="new-pass" class="stylish-input"></div>
        <div class="btn-group">
          <button onclick="saveNewPassword()">パスワード変更</button>
          <button onclick="closeModal()" class="btn-secondary">キャンセル</button>
        </div>
      `;
    }

    // Firebase Auth: パスワード更新
    async function saveNewPassword() {
      const newPass = document.getElementById('new-pass').value;
      if (newPass.length < 6) { alert('⚠️ 新しいパスワードは6文字以上で入力してください。'); return; }
      const user = auth.currentUser;
      if (!user) return;
      try {
        await user.updatePassword(newPass);
        saveAuthInputs(user.email || currentUser.email, newPass);
        await saveStorage();
        closeModal();
        alert('🔑 パスワードを正常に変更しました。');
      } catch (error) {
        if (error.code === 'auth/requires-recent-login') {
          const currentPass = prompt('安全確認のため、現在のパスワードを入力してください。');
          if (!currentPass) return;
          try {
            const credential = firebase.auth.EmailAuthProvider.credential(user.email, currentPass);
            await user.reauthenticateWithCredential(credential);
            await user.updatePassword(newPass);
            saveAuthInputs(user.email || currentUser.email, newPass);
            closeModal();
            alert('🔑 パスワードを変更しました。');
          } catch (reauthError) {
            alert('⚠️ 現在のパスワード確認に失敗しました。');
          }
        } else {
          alert('⚠️ パスワード変更に失敗しました: ' + error.message);
        }
      }
    }

    document.addEventListener('input', function(e) {
      if (e.target && e.target.id === 'auth-email') saveAuthInputs(e.target.value, document.getElementById('auth-pass')?.value || '');
      if (e.target && e.target.id === 'auth-pass') saveAuthInputs(document.getElementById('auth-email')?.value || '', e.target.value);
    });

    // Firebase Auth: ログアウト
    function logout() {
      auth.signOut().then(() => {
        currentUser = { loggedIn: false, email: '', name: '', uid: '' };
        localStorage.removeItem('gourmet_current_user');
        loadCurrentUserData();
        updateAuthUI();
        renderCurrentMap();
        alert('ログアウトしました。');
      });
    }
  </script>
</body>
</html>
