<!DOCTYPE html>
<html lang="ja" data-theme="casual">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>地区特化 グルメマップ</title>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- 分割したcssの読み込み -->
  <link rel="stylesheet" href="02_style.css">
</head>
<body>

  <div id="map"></div>

  <!-- 上部インジケーター & エリア切替 -->
  <div class="top-bar">
    <span id="map-indicator" class="indicator-btn" onclick="openStoreListModal()" title="登録店舗一覧を表示">店舗: 0/200 📋</span>
    <select id="area-select" onchange="moveToArea(this.value)">
      <option value="">エリア移動</option>
    </select>
    <button id="main-op-btn" class="op-btn" onclick="toggleControlPanel()">≡ 操作</button>
  </div>

  <!-- 左側操作ボタン群 -->
  <div class="left-controls">
    <button class="ctrl-btn btn-store" onclick="openStoreModal()">📍 店舗登録</button>
    <button class="ctrl-btn btn-area" onclick="openAreaModal()">🚩 エリア登録</button>
    <button class="ctrl-btn btn-filter" onclick="openFilterModal()">🔍 絞り込み</button>
  </div>

  <!-- アカウント・データ管理パネル -->
  <div id="control-panel" class="control-panel hidden">
    <div class="panel-header">
      <span>アカウント・データ管理</span>
      <button onclick="toggleControlPanel()">✕</button>
    </div>
    <div class="panel-body">
      <div id="auth-status-container">
        <p id="user-status-text">ログインしていません</p>
        <button id="login-btn" class="panel-action-btn" onclick="handleLogin()">ログイン / 新規登録</button>
        <button id="logout-btn" class="panel-action-btn hidden" onclick="handleLogout()">ログアウト</button>
      </div>
      <hr>
      <div class="data-actions">
        <button class="panel-action-btn" onclick="exportData()">データバックアップ (JSON)</button>
        <button class="panel-action-btn" onclick="importData()">データ復元 (JSON)</button>
        <button class="panel-action-btn danger" onclick="clearAllData()">全データ初期化</button>
      </div>
    </div>
  </div>

  <!-- 各種モータル（店舗登録、エリア登録、絞り込み、店舗一覧） -->
  <div id="store-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>店舗登録</h2>
        <button onclick="closeStoreModal()">✕</button>
      </div>
      <div class="modal-body">
        <label>店舗名 <span class="required">*</span></label>
        <input type="text" id="store-name" placeholder="例: 美味しいラーメン屋">
        
        <label>ジャンル</label>
        <input type="text" id="store-genre" placeholder="例: ラーメン、カフェ">

        <label>エリア</label>
        <select id="store-area-select">
          <option value="">指定なし</option>
        </select>

        <label>評価</label>
        <select id="store-rating">
          <option value="5">★★★★★ (5)</option>
          <option value="4">★★★★☆ (4)</option>
          <option value="3" selected>★★★☆☆ (3)</option>
          <option value="2">★★☆☆☆ (2)</option>
          <option value="1">★☆☆☆☆ (1)</option>
        </select>

        <label>メモ</label>
        <textarea id="store-memo" rows="3" placeholder="おすすめメニューなど"></textarea>

        <p class="guide-text">※地図上をクリックしてピンの位置を指定してください。</p>
        <input type="hidden" id="store-lat">
        <input type="hidden" id="store-lng">
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeStoreModal()">キャンセル</button>
        <button class="btn-primary" onclick="saveStore()">保存する</button>
      </div>
    </div>
  </div>

  <div id="area-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>エリア登録</h2>
        <button onclick="closeAreaModal()">✕</button>
      </div>
      <div class="modal-body">
        <label>エリア名 <span class="required">*</span></label>
        <input type="text" id="area-name" placeholder="例: 横浜駅周辺">
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeAreaModal()">キャンセル</button>
        <button class="btn-primary" onclick="saveArea()">登録する</button>
      </div>
    </div>
  </div>

  <div id="filter-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>絞り込み</h2>
        <button onclick="closeFilterModal()">✕</button>
      </div>
      <div class="modal-body">
        <label>ジャンルで絞り込み</label>
        <input type="text" id="filter-genre" placeholder="キーワード入力">

        <label>最低評価</label>
        <select id="filter-rating">
          <option value="0">すべて表示</option>
          <option value="3">★3以上</option>
          <option value="4">★4以上</option>
          <option value="5">★5のみ</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="resetFilter()">リセット</button>
        <button class="btn-primary" onclick="applyFilter()">適用</button>
      </div>
    </div>
  </div>

  <div id="store-list-modal" class="modal hidden">
    <div class="modal-content large">
      <div class="modal-header">
        <h2>登録店舗一覧</h2>
        <button onclick="closeStoreListModal()">✕</button>
      </div>
      <div class="modal-body">
        <ul id="store-list-container" class="store-list"></ul>
      </div>
    </div>
  </div>

  <!-- 分割したjsの読み込み -->
  <script src="03_script.js"></script>
</body>
</html>
