<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グルメマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ヘッダー -->
  <header>
    <div style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-utensils" style="color: var(--primary-color); font-size: 18px;"></i>
      <div id="map-title-display"></div>
      <i class="fa-solid fa-chevron-down" style="font-size: 10px; color: #888; cursor: pointer;" onclick="toggleMapDropdown()"></i>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="header-menu-container">
        <div class="menu-icon" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
        <div id="dropdown-menu" class="dropdown-menu">
          <div class="menu-item" onclick="openMapManagementModal()"><i class="fa-solid fa-map"></i> マップ管理・作成</div>
          <div class="menu-item" onclick="openAreaManagementModal()"><i class="fa-solid fa-layer-group"></i> エリア管理</div>
          <div class="menu-item" onclick="openCustomListModal()"><i class="fa-solid fa-list-check"></i> カスタムリスト管理</div>
          <div style="border-top:1px solid #eee; margin:4px 0;"></div>
          <div class="menu-item" onclick="exportCode()"><i class="fa-solid fa-share-nodes"></i> 共有コードの発行・設定</div>
          <div class="menu-item" onclick="importCodePrompt()"><i class="fa-solid fa-download"></i> 共有コードで読み込み</div>
          <div style="border-top:1px solid #eee; margin:4px 0;"></div>
          <div class="menu-item" onclick="openAccountModal()"><i class="fa-solid fa-user-gear"></i> アカウント設定</div>
          <div class="menu-item" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> ダークモード切替</div>
          <div class="menu-item" onclick="handleLogout()" style="color:#e74c3c;"><i class="fa-solid fa-right-from-bracket"></i> ログアウト</div>
        </div>
      </div>
    </div>
  </header>

  <!-- マップドロップダウン -->
  <div id="map-dropdown-menu" class="dropdown-menu" style="top: 50px; left: 15px; width: 200px;"></div>

  <!-- 検索バー -->
  <div id="search-bar-container">
    <div class="search-input-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" placeholder="店名、エリア、ジャンルで検索..." onkeyup="handleSearchInput(event)">
      <button class="filter-btn" onclick="toggleSearchFilter()"><i class="fa-solid fa-sliders"></i> 絞り込み</button>
    </div>
  </div>

  <!-- 地図エリア -->
  <div id="map"></div>

  <!-- 下部操作エリア -->
  <div class="bottom-controls">
    <div class="indicator-group">
      <span class="indicator-btn" id="list-indicator" onclick="openCustomListModal()"><i class="fa-solid fa-list-check"></i> リスト未選択</span>
      <span class="indicator-btn" id="area-indicator" onclick="openAreaManagementModal()"><i class="fa-solid fa-layer-group"></i> エリア未選択</span>
    </div>
    <button class="fab-add" onclick="openStoreModal()"><i class="fa-solid fa-plus"></i> 追加</button>
  </div>

  <!-- 詳細パネル & 検索結果パネル -->
  <div id="detail-panel" class="detail-panel"></div>
  <div id="search-results-panel" class="detail-panel"></div>

  <!-- 汎用モーダル構造 -->
  <div id="modal-overlay" class="modal-overlay">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- 外部ライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <!-- アプリケーションJS (type="module"を削除し、?v=2を追加) -->
  <script src="js/config.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/map.js?v=2"></script>
  <script src="js/ui_modal.js?v=2"></script>
  <script src="js/store_modal.js?v=2"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/area.js?v=2"></script>
  <script src="js/list_search.js?v=2"></script>
</body>
</html>
