<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グルメマップ</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    .error-msg {
      color: #d9534f;
      font-weight: bold;
      margin-top: 6px;
      display: none;
    }
    .success-msg {
      color: #5cb85c;
      font-weight: bold;
      margin-top: 6px;
      display: none;
    }
  </style>

  <!-- Firebase SDK (必要に応じてバージョンや設定を合わせてください) -->
  <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>マイグルメマップ</h1>

  <!-- 共有コード設定エリア -->
  <div class="form-group">
    <label for="shareCode">共有コード設定 (6〜20文字)</label>
    <input type="text" id="shareCode" placeholder="例: mymap2026" minlength="6" maxlength="20">
    <button type="button" id="saveBtn" onclick="saveShareCode()">共有コードを保存</button>
    
    <!-- メッセージ表示エリア -->
    <p id="codeError" class="error-msg"></p>
    <p id="codeSuccess" class="success-msg"></p>
  </div>

  <script>
    // ※各自のFirebase設定情報を設定してください
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebaseの初期化
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 共有コードの保存および重複チェック処理
    async function saveShareCode() {
      const input = document.getElementById('shareCode');
      const codeValue = input.value.trim();
      const errorEl = document.getElementById('codeError');
      const successEl = document.getElementById('codeSuccess');

      // 表示のリセット
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      // ① 文字数チェック（6文字以上20文字以内）
      if (codeValue.length < 6 || codeValue.length > 20) {
        showError('共有コードは6文字以上20文字以内で入力してください。');
        return;
      }

      // ② 文字種チェック（半角英数字・ハイフン・アンダースコアのみ許可）
      const validRegex = /^[a-zA-Z0-9-_]+$/;
      if (!validRegex.test(codeValue)) {
        showError('半角英数字、ハイフン(-)、アンダースコア(_)のみ使用できます。');
        return;
      }

      try {
        // ③ 重複チェック（DBの "maps" コレクション内を検索）
        const snapshot = await db.collection('maps')
                                 .where('shareCode', '==', codeValue)
                                 .get();

        if (!snapshot.empty) {
          showError('この共有コードは既に使われています。別のコードを指定してください。');
          return;
        }

        // ④ 保存処理（例: 新規ドキュメントとして保存）
        await db.collection('maps').add({
          shareCode: codeValue,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // 成功表示
        successEl.textContent = '共有コードを設定しました！';
        successEl.style.display = 'block';

      } catch (err) {
        console.error(err);
        showError('処理中にエラーが発生しました。再度お試しください。');
      }
    }

    function showError(message) {
      const errorEl = document.getElementById('codeError');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }
  </script>
</body>
</html>
