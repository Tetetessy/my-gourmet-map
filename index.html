<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイグルメマップ</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* ヘッダー操作エリア */
    .header-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .badge {
      font-size: 12px;
      background: #fff0e6;
      color: #d9534f;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ffcca8;
    }
    .btn {
      background: #ff7b6e;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-action {
      margin-left: auto;
      background: #ff5241;
    }

    .side-menu {
      position: absolute;
      top: 50px;
      left: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 地図エリア（スマホの高さ潰れ・Brave対策） */
    #map {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100%;
      background-color: #fdf8f5;
    }
  </style>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // アプリ内ブラウザの警告
    document.addEventListener("DOMContentLoaded", function() {
      const ua = navigator.userAgent.toLowerCase();
      const isInApp = ua.includes('line') || ua.includes('instagram') || ua.includes('fbav') || ua.includes('twitter');
      if (isInApp) {
        alert("アプリ内ブラウザでは画面が正常に動かない場合があります。右下のメニューから「Safariで開く」または「Chromeで開く」を選択してください。");
      }
      
      initMap();
    });

    // 地図の初期化処理
    function initMap() {
      try {
        // 東京駅を中心に設定
        const map = L.map('map').setView([35.681236, 139.767125], 14);

        // OpenStreetMap タイルレイヤーの読み込み
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 描画ズレ防止（描画サイズリセット）
        setTimeout(function() {
          map.invalidateSize();
        }, 300);

      } catch (e) {
        console.error("Map load error:", e);
      }
    }
  </script>
</head>
<body>

  <!-- 操作UI -->
  <div class="header-bar">
    <span class="badge">店舗: 0/200 📍</span>
    <button class="btn">エリア移動 ∨</button>
    <button class="btn btn-action">≡ 操作</button>
  </div>

  <div class="side-menu">
    <button class="btn">📍 店舗登録</button>
    <button class="btn">🚩 エリア登録</button>
    <button class="btn">🔍 絞り込み</button>
  </div>

  <!-- 地図表示エリア -->
  <div id="map"></div>

</body>
</html>
