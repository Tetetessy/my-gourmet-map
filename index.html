<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗＆エリア ピン留めマップ（修正版）</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #333;
    }

    /* ヘッダー */
    header {
      background-color: #2c3e50;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* メインコンテンツレイアウト */
    .main-container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* サイドバー（左側） */
    .sidebar {
      width: 360px;
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      z-index: 900;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
      position: relative;
    }

    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid #e9ecef;
    }

    .sidebar-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #6c757d;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ボタン群 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      gap: 6px;
    }
    .btn-primary {
      background-color: #0d6efd;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0b5ed7;
    }
    .btn-outline {
      background-color: white;
      border-color: #ced4da;
      color: #495057;
    }
    .btn-outline:hover {
      background-color: #e9ecef;
    }
    .btn-block {
      width: 100%;
    }

    .registration-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 検索ボックス */
    .search-box {
      position: relative;
      margin-bottom: 10px;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      padding-right: 32px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
    }

    /* 検索結果・登録一覧リスト */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px;
    }

    .item-card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .item-card:hover {
      border-color: #0d6efd;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .item-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .item-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: #212529;
    }
    .item-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e9ecef;
      color: #495057;
    }
    .item-badge.area {
      background: #e2d9f3;
      color: #593196;
    }
    .item-address {
      font-size: 0.8rem;
      color: #6c757d;
      margin-bottom: 6px;
    }
    .item-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 0.7rem;
      background: #f1f3f5;
      color: #495057;
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* マップエリア */
    .map-container {
      flex: 1;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* 2. 店舗ピンタップ時の簡易詳細ウィンドウ（縦長・検索結果の横（サイドバー直右）に配置） */
    .floating-detail-window {
      position: absolute;
      top: 16px;
      left: 376px; /* サイドバー幅360px + 余白16px */
      width: 300px;
      height: calc(100% - 32px); /* 縦長指定 */
      max-height: 650px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .detail-header {
      padding: 16px;
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .detail-header h2 {
      font-size: 1.1rem;
      color: #212529;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #adb5bd;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover {
      color: #212529;
    }

    .detail-body {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }
    .detail-image {
      width: 100%;
      height: 140px;
      background-color: #e9ecef;
      border-radius: 6px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #adb5bd;
      font-size: 0.85rem;
    }
    .detail-info-group {
      margin-bottom: 14px;
    }
    .detail-label {
      font-size: 0.75rem;
      color: #6c757d;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .detail-value {
      font-size: 0.85rem;
      color: #333;
    }

    .detail-footer {
      padding: 12px 16px;
      border-top: 1px solid #e9ecef;
      background: #f8f9fa;
      display: flex;
      gap: 8px;
    }

    /* 非表示クラス */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <h1>店舗＆エリア ピンマップ</h1>
    <div>
      <button class="btn btn-outline" style="font-size:0.8rem; padding:4px 8px;">ヘルプ</button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="main-container">

    <!-- サイドバー -->
    <aside class="sidebar">
      
      <!-- 1. 新規登録セクション -->
      <div class="sidebar-section">
        <div class="sidebar-title">新規登録</div>
        <div class="registration-actions">
          <button class="btn btn-primary">
            📍 店舗登録
          </button>
          <button class="btn btn-outline">
            🔲 エリア登録
          </button>
        </div>
      </div>

      <!-- 1. 絞り込み＆検索セクション（ピン/エリア登録の直下に配置） -->
      <div class="sidebar-section">
        <div class="sidebar-title">検索・絞り込み</div>
        <div class="search-box">
          <input type="text" placeholder="店舗名、キーワード検索...">
        </div>
        <!-- 左上（サイドバー内の上部）に配置された絞り込みボタン -->
        <button class="btn btn-outline btn-block" id="filter-toggle-btn">
          ⚙️ 条件絞り込み（カテゴリ・タグ）
        </button>
      </div>

      <!-- 検索結果・一覧セクション -->
      <div class="list-container">
        <div class="sidebar-title">登録済みリスト (3)</div>
        
        <!-- サンプルカード 1 -->
        <div class="item-card" onclick="openDetail('カフェ・ド・マップ', '東京都千代田区1-1', 'カフェ・喫茶', 'Wi-Fiあり, 電源あり, 禁煙')">
          <div class="item-card-header">
            <span class="item-title">カフェ・ド・マップ</span>
            <span class="item-badge">店舗</span>
          </div>
          <div class="item-address">東京都千代田区1-1</div>
          <div class="item-tags">
            <span class="tag">Wi-Fiあり</span>
            <span class="tag">電源あり</span>
          </div>
        </div>

        <!-- サンプルカード 2 -->
        <div class="item-card" onclick="openDetail('居酒屋 まっぷ', '東京都千代田区1-2', '居酒屋', '個室あり, カード可')">
          <div class="item-card-header">
            <span class="item-title">居酒屋 まっぷ</span>
            <span class="item-badge">店舗</span>
          </div>
          <div class="item-address">東京都千代田区1-2</div>
          <div class="item-tags">
            <span class="tag">個室あり</span>
            <span class="tag">夜間営業</span>
          </div>
        </div>

        <!-- サンプルカード 3 -->
        <div class="item-card">
          <div class="item-card-header">
            <span class="item-title">丸の内重点エリア</span>
            <span class="item-badge area">エリア</span>
          </div>
          <div class="item-address">指定ポリゴンエリア</div>
          <div class="item-tags">
            <span class="tag">営業強化地域</span>
          </div>
        </div>

      </div>
    </aside>

    <!-- マップエリア -->
    <main class="map-container">
      <div id="map"></div>

      <!-- 2. 簡易詳細ウィンドウ（検索結果のすぐ横・縦長） -->
      <div id="detail-window" class="floating-detail-window hidden">
        <div class="detail-header">
          <div>
            <span class="item-badge" style="margin-bottom: 4px; display:inline-block;">店舗</span>
            <h2 id="detail-title">店舗名称</h2>
          </div>
          <button class="close-btn" onclick="closeDetail()">&times;</button>
        </div>
        <div class="detail-body">
          <div class="detail-image">店舗写真・イメージ</div>
          
          <div class="detail-info-group">
            <div class="detail-label">住所</div>
            <div class="detail-value" id="detail-address">-</div>
          </div>

          <div class="detail-info-group">
            <div class="detail-label">カテゴリ</div>
            <div class="detail-value" id="detail-category">-</div>
          </div>

          <div class="detail-info-group">
            <div class="detail-label">タグ・特徴</div>
            <div class="detail-value" id="detail-tags">-</div>
          </div>

          <div class="detail-info-group">
            <div class="detail-label">メモ・備考</div>
            <div class="detail-value">ここに店舗に関する詳細なメモや特記事項が表示されます。縦長ウィンドウのためスクロールして多くの情報を確認できます。</div>
          </div>
        </div>
        <div class="detail-footer">
          <button class="btn btn-primary btn-block" style="font-size:0.8rem;">詳細を見る</button>
          <button class="btn btn-outline" style="font-size:0.8rem;">編集</button>
        </div>
      </div>
    </main>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // マップ初期化（東京駅周辺）
    const map = L.map('map').setView([35.681236, 139.767125], 15);

    // OpenStreetMap タイルレイヤー
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // サンプルピン 1
    const marker1 = L.marker([35.681236, 139.767125]).addTo(map);
    marker1.on('click', () => {
      openDetail('カフェ・ド・マップ', '東京都千代田区1-1', 'カフェ・喫茶', 'Wi-Fiあり, 電源あり, 禁煙');
    });

    // サンプルピン 2
    const marker2 = L.marker([35.683000, 139.765000]).addTo(map);
    marker2.on('click', () => {
      openDetail('居酒屋 まっぷ', '東京都千代田区1-2', '居酒屋', '個室あり, カード可');
    });

    // サンプルエリア（ポリゴン）
    const polygon = L.polygon([
      [35.680000, 139.766000],
      [35.682000, 139.769000],
      [35.679000, 139.770000]
    ], {
      color: '#6f42c1',
      fillColor: '#6f42c1',
      fillOpacity: 0.2
    }).addTo(map);

    // 簡易詳細ウィンドウ表示関数
    function openDetail(name, address, category, tags) {
      document.getElementById('detail-title').innerText = name;
      document.getElementById('detail-address').innerText = address;
      document.getElementById('detail-category').innerText = category;
      document.getElementById('detail-tags').innerText = tags;
      
      document.getElementById('detail-window').classList.remove('hidden');
    }

    // 簡易詳細ウィンドウ非表示関数
    function closeDetail() {
      document.getElementById('detail-window').classList.add('hidden');
    }
  </script>
</body>
</html>
